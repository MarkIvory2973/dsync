name: Build

on:
  push:
    tags: v*.*.*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ linux, windows, darwin ]
        arch: [ arm64, amd64 ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache-dependency-path: src/go.sum

      - name: Install
        run: |
          cd src
          go mod tidy

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          case "${GOOS}" in
            linux) export GOOUT=dsync_linux_${GOARCH} ;;
            windows) export GOOUT=dsync_windows_${GOARCH}.exe ;;
            darwin) export GOOUT=dsync_macos_${GOARCH} ;;
          esac

          cd src
          go build -o ${GOOUT}
          cd ..
          mkdir dist
          mv src/${GOOUT} dist

      - uses: actions/upload-artifact@v7
        with:
          name: build_${{ matrix.os }}_${{ matrix.arch }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build_*_*
          merge-multiple: true
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: DSync ${{ github.ref_name }}
          draft: true
          files: dist/*